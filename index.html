<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>НМТ Історія України: Інтерактивний тренажер</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f4ecdc;
      color: #23372b;
    }
    .custom-shadow {
      box-shadow: 0 10px 25px -5px rgba(43, 69, 54, 0.1), 0 8px 10px -6px rgba(43, 69, 54, 0.1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-8">

  <!-- Контейнер застосунку -->
  <div class="max-w-3xl w-full mx-auto bg-white rounded-3xl border-2 border-[#2b4536] p-6 sm:p-8 custom-shadow transition-all">
    
    <!-- Шапка / Брендинг -->
    <header class="flex flex-wrap items-center justify-between border-b border-[#e5dcce] pb-5 mb-6 gap-3">
      <div class="flex items-center gap-2.5 bg-[#2b4536] text-white px-4 py-1.5 rounded-full shadow-sm">
        <i class="fa-brands fa-instagram text-[#eab446]"></i>
        <span class="text-sm font-extrabold tracking-wide">hist.viktoria</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs font-black uppercase text-[#943429] tracking-widest">Програма НМТ</span>
        <span class="text-[#c4b69d]">•</span>
        <span class="bg-[#f0e7d8] text-[#2b4536] text-xs font-bold px-2.5 py-1 rounded-lg">Тема 2</span>
      </div>
    </header>

    <!-- Прогрес і статистика -->
    <div class="flex items-center justify-between text-sm font-bold text-[#6d6153] mb-3">
      <span id="question-counter">Запитання 1 з 15</span>
      <span id="score-counter">Бали: 0</span>
    </div>
    <div class="w-full bg-[#eee5d5] rounded-full h-2.5 mb-6 overflow-hidden">
      <div id="progress-bar" class="bg-[#df9f28] h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Область тесту -->
    <main id="quiz-area">
      <!-- Текст запитання -->
      <div class="mb-6">
        <span id="question-type" class="inline-block text-xs font-bold text-[#84611d] bg-[#fbf2dd] border border-[#f1deba] px-3 py-1 rounded-md mb-2">
          Завантаження...
        </span>
        <h2 id="question-text" class="text-lg sm:text-xl font-bold text-[#23372b] leading-relaxed">
          Завантаження запитання...
        </h2>
      </div>

      <!-- Варіанти відповідей -->
      <div id="options-container" class="space-y-3 mb-6">
        <!-- Кнопки варіантів генеруються через JS -->
      </div>

      <!-- Блок пояснення (спочатку прихований) -->
      <div id="feedback-box" class="hidden p-4 rounded-2xl mb-6 border transition-all">
        <div class="flex items-center gap-2 mb-1">
          <i id="feedback-icon" class="fa-solid text-lg"></i>
          <h4 id="feedback-title" class="font-extrabold text-sm uppercase tracking-wide"></h4>
        </div>
        <p id="feedback-text" class="text-sm leading-relaxed font-medium text-[#3b473e]"></p>
      </div>

      <!-- Кнопка «Наступне» -->
      <div class="flex justify-end">
        <button id="next-btn" class="hidden bg-[#2b4536] hover:bg-[#1d3126] text-white font-extrabold text-sm uppercase px-6 py-3 rounded-xl transition duration-200 flex items-center gap-2 shadow-md">
          <span>Наступне запитання</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </main>

    <!-- Фінальний екран результату (прихований) -->
    <div id="result-screen" class="hidden text-center py-8">
      <div class="w-20 h-20 bg-[#f4ecdc] text-[#2b4536] rounded-full flex items-center justify-center mx-auto mb-4 border-2 border-[#df9f28] shadow-md">
        <i class="fa-solid fa-award text-3xl text-[#df9f28]"></i>
      </div>
      <h3 class="text-2xl font-black text-[#23372b] uppercase mb-2">Тестування завершено!</h3>
      <p id="final-score-text" class="text-base text-[#6d6153] font-semibold mb-6"></p>
      <button id="restart-btn" class="bg-[#2b4536] hover:bg-[#1d3126] text-white font-black text-sm uppercase px-8 py-3.5 rounded-xl transition shadow-lg inline-flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i>
        <span>Пройти ще раз</span>
      </button>
    </div>

  </div>

  <!-- Футер -->
  <footer class="text-center text-xs font-semibold text-[#8b8072] mt-6">
    Тренажер підготовки до НМТ з історії України • Стародавня історія
  </footer>

  <script>
    const questions = [
      {
        type: "Первісне суспільство",
        question: "Що з наведеного є характерною ознакою епохи палеоліту?",
        options: [
          "Поява землеробства та скотарства",
          "Використання вогню та виготовлення перших кам'яних знарядь праці",
          "Винайдення лука і стріл",
          "Приручення коня та винайдення колеса"
        ],
        correct: 1,
        explanation: "В епоху палеоліту (давнього кам'яного віку) люди навчилися використовувати вогонь та виготовляти найпростіші кам'яні знаряддя праці (наприклад, рубила). Землеробство виникло в неоліті, а лук і стріли — в мезоліті."
      },
      {
        type: "Первісне суспільство",
        question: "Яка кардинальна зміна в житті людей відбулася в період мезоліту?",
        options: [
          "Перехід до відтворювального господарства",
          "Винайдення кераміки та ткацтва",
          "Поширення мікролітів та винайдення лука і стріл",
          "Початок обробки міді"
        ],
        correct: 2,
        explanation: "У мезоліті (середньому кам'яному віці) через потепління і зміну фауни люди винайшли лук і стріли для полювання на дрібних тварин, а також почали використовувати мікроліти (дрібні кам'яні пластини-вкладиші)."
      },
      {
        type: "Первісне суспільство",
        question: "Суть неолітичної революції полягає в:",
        options: [
          "переході від привласнювального до відтворювального господарства",
          "винайденні перших знарядь праці з металу",
          "відокремленні ремесла від землеробства",
          "виникненні перших державних утворень"
        ],
        correct: 0,
        explanation: "Неолітична революція — це історичний перехід людства від полювання та збиральництва (привласнювальне господарство) до землеробства і скотарства (відтворювальне господарство)."
      },
      {
        type: "Енеоліт. Трипільська культура",
        question: "Що було основою господарства племен трипільської культури?",
        options: [
          "Кочове скотарство",
          "Орне землеробство",
          "Залізоробне ремесло",
          "Морська торгівля"
        ],
        correct: 1,
        explanation: "Трипільці були носіями землеробської культури енеоліту. Вони займалися орним землеробством, вирощували пшеницю, ячмінь та вели осілий спосіб життя, будуючи великі поселення (протоміста)."
      },
      {
        type: "Енеоліт. Трипільська культура",
        question: "Яка ознака є характерною саме для трипільської археологічної культури?",
        options: [
          "Створення полісів у Північному Причорномор'ї",
          "Виготовлення мальованої кераміки з орнаментом",
          "Будівництво монументальних кам'яних пірамід (курганів)",
          "Використання бойових колісниць у військових походах"
        ],
        correct: 1,
        explanation: "Трипільську культуру часто називають «культурою мальованої кераміки» через надзвичайно високий рівень розвитку гончарства та характерний розпис посуду спіральними багатоколірними візерунками."
      },
      {
        type: "Ранній залізний вік",
        question: "Який кочовий народ першим на території України почав виплавляти залізо з болотної руди і згадується в писемних джерелах?",
        options: [
          "Сармати",
          "Скіфи",
          "Кіммерійці",
          "Авари"
        ],
        correct: 2,
        explanation: "Кіммерійці (IX–VII ст. до н. е.) — перший народ на території України, назва якого відома з писемних джерел («Одіссея» Гомера), і перші, хто почав масово виготовляти зброю і знаряддя із заліза."
      },
      {
        type: "Ранній залізний вік. Скіфи",
        question: "У якому кургані археолог Борис Мозолевський знайшов знамениту скіфську золоту пектораль?",
        options: [
          "Товста Могила",
          "Чортомлик",
          "Солоха",
          "Гайманова Могила"
        ],
        correct: 0,
        explanation: "Шедевр скіфського ювелірного мистецтва — золота пектораль (нагрудна прикраса скіфського царя) була знайдена у 1971 році під час розкопок кургану Товста Могила на Дніпропетровщині."
      },
      {
        type: "Ранній залізний вік. Скіфи",
        question: "З яким могутнім перським царем вели переможну війну скіфи наприкінці VI ст. до н. е.?",
        options: [
          "Кіром Великим",
          "Дарієм І",
          "Ксерксом",
          "Камбісом"
        ],
        correct: 1,
        explanation: "У 514 р. до н. е. перський цар Дарій І здійснив великий похід на скіфські землі. Скіфи, застосувавши партизанську тактику «спаленої землі», змусили його величезне військо ганебно відступити."
      },
      {
        type: "Ранній залізний вік. Сармати",
        question: "Яка соціальна риса була характерною для сарматських племен, що панували в степах України з ІІІ ст. до н. е. до ІІІ ст. н. е.?",
        options: [
          "Карбування власної золотої монети",
          "Високий статус жінок і наявність жінок-войовниць",
          "Створення потужного флоту на Чорному та Азовському морях",
          "Заснування античних міст-держав"
        ],
        correct: 1,
        explanation: "Для сарматів були характерні пережитки матріархату. Жінки мали високий статус у суспільстві, часто їздили верхи та брали участь у битвах нарівні з чоловіками (що пов'язують з міфами про амазонок)."
      },
      {
        type: "Античні міста-держави",
        question: "Що було головною причиною Великої грецької колонізації Північного Причорномор'я у VIII–VI ст. до н. е.?",
        options: [
          "Загроза поневолення греків Римською імперією",
          "Нестача родючої орної землі та демографічний вибух у Греції",
          "Прагнення греків поширити християнство серед варварів",
          "Пошук нових ринків збуту для залізної зброї"
        ],
        correct: 1,
        explanation: "Головними причинами Великої грецької колонізації були соціально-економічні: швидке зростання населення і нестача родючих земель (аграрне перенаселення) у самій Греції, а також пошук нових джерел сировини."
      },
      {
        type: "Античні міста-держави",
        question: "Яке античне місто-держава розташовувалося на південному заході Кримського півострова (в межах сучасного Севастополя)?",
        options: [
          "Ольвія",
          "Тіра",
          "Пантікапей",
          "Херсонес"
        ],
        correct: 3,
        explanation: "Херсонес Таврійський знаходився на території сучасного Севастополя. Інші великі міста: Ольвія (Побужжя), Тіра (гирло Дністра), Пантікапей (сучасна Керч)."
      },
      {
        type: "Велике переселення народів",
        question: "Навала якого кочового народу в 70-х роках IV ст. поклала початок Великому переселенню народів і зруйнувала Боспорське царство?",
        options: [
          "Готів",
          "Гунів",
          "Аварів",
          "Хозарів"
        ],
        correct: 1,
        explanation: "У 375 році гуни (кочовий тюркомовний народ з Азії) перейшли Дон, розгромили готський союз племен і рушили на Захід. Ця подія вважається початком Великого переселення народів."
      },
      {
        type: "Давні слов'яни",
        question: "Під якими назвами давні слов'яни вперше згадуються у працях римських та візантійських істориків (Плінія Старшого, Тацита, Птолемея, Йордана)?",
        options: [
          "Венеди, анти, склавини",
          "Поляни, сіверяни, деревляни",
          "Русичі, роси, рутени",
          "Сармати, роксолани, алани"
        ],
        correct: 0,
        explanation: "Римські історики І–ІІ ст. називали слов'ян венедами. Пізніше, у працях візантійських авторів VI ст. (Йордан, Прокопій Кесарійський), слов'яни розділилися і фігурують вже як анти та склавини."
      },
      {
        type: "Давні слов'яни",
        question: "Що було основою господарства давніх слов'ян?",
        options: [
          "Кочове екстенсивне скотарство",
          "Орне (підсічно-вогневе та перелогове) землеробство",
          "Морське піратство та рибальство",
          "Посередницька транзитна торгівля"
        ],
        correct: 1,
        explanation: "Давні слов'яни вели осілий спосіб життя. Основою їхнього господарства було орне землеробство: підсічно-вогневе (у лісовій зоні, де випалювали ліс) та перелогове (у лісостеповій зоні)."
      },
      {
        type: "Хронологія",
        question: "Укажіть правильну хронологічну послідовність панування кочових народів на території південної України в давнину:",
        options: [
          "Скіфи → кіммерійці → сармати → гуни",
          "Кіммерійці → скіфи → сармати → гуни",
          "Сармати → скіфи → гуни → кіммерійці",
          "Кіммерійці → сармати → скіфи → гуни"
        ],
        correct: 1,
        explanation: "Правильна хронологічна послідовність появи та панування цих народів у причорноморських степах: кіммерійці (IX–VII ст. до н.е.), потім скіфи (VII–III ст. до н.е.), далі сармати (III ст. до н.е. – III ст. н.е.) і наостанок гуни (кінець IV ст. н.е.)."
      }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const questionCounter = document.getElementById("question-counter");
    const scoreCounter = document.getElementById("score-counter");
    const progressBar = document.getElementById("progress-bar");
    const questionType = document.getElementById("question-type");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedbackBox = document.getElementById("feedback-box");
    const feedbackTitle = document.getElementById("feedback-title");
    const feedbackIcon = document.getElementById("feedback-icon");
    const feedbackText = document.getElementById("feedback-text");
    const nextBtn = document.getElementById("next-btn");
    const quizArea = document.getElementById("quiz-area");
    const resultScreen = document.getElementById("result-screen");
    const finalScoreText = document.getElementById("final-score-text");
    const restartBtn = document.getElementById("restart-btn");

    function renderQuestion() {
      answered = false;
      const q = questions[currentQuestionIndex];
      
      questionCounter.textContent = `Запитання ${currentQuestionIndex + 1} з ${questions.length}`;
      scoreCounter.textContent = `Бали: ${score}`;
      
      // Анімація прогрес-бару
      setTimeout(() => {
        progressBar.style.width = `${((currentQuestionIndex + 1) / questions.length) * 100}%`;
      }, 50);
      
      questionType.textContent = q.type;
      questionText.textContent = q.question;
      
      optionsContainer.innerHTML = "";
      feedbackBox.className = "hidden p-4 rounded-2xl mb-6 border transition-all";
      nextBtn.classList.add("hidden");

      q.options.forEach((opt, idx) => {
        const btn = document.createElement("button");
        btn.className = "w-full text-left p-4 rounded-xl border-2 border-[#d9cebc] hover:border-[#2b4536] bg-[#faf6ef] hover:bg-white text-[#23372b] font-semibold text-sm transition-all duration-150 flex items-start gap-3";
        btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-[#e5dcce] text-[#2b4536] font-bold text-xs shrink-0 mt-0.5">${['А', 'Б', 'В', 'Г'][idx]}</span><span class="leading-relaxed">${opt}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(selectedIndex) {
      if (answered) return;
      answered = true;
      
      const q = questions[currentQuestionIndex];
      const buttons = optionsContainer.querySelectorAll("button");
      
      buttons.forEach((btn, idx) => {
        btn.disabled = true;
        btn.classList.remove("hover:bg-white", "hover:border-[#2b4536]");
        if (idx === q.correct) {
          btn.classList.add("bg-[#e2f0e6]", "border-[#2b4536]", "text-[#1d3d28]");
          btn.querySelector("span:first-child").className = "inline-flex items-center justify-center w-6 h-6 rounded-md bg-[#2b4536] text-white font-bold text-xs shrink-0 mt-0.5";
        } else if (idx === selectedIndex) {
          btn.classList.add("bg-[#faede9]", "border-[#943429]", "text-[#943429]");
          btn.querySelector("span:first-child").className = "inline-flex items-center justify-center w-6 h-6 rounded-md bg-[#943429] text-white font-bold text-xs shrink-0 mt-0.5";
        } else {
          btn.classList.add("opacity-60");
        }
      });

      feedbackBox.classList.remove("hidden");
      if (selectedIndex === q.correct) {
        score++;
        scoreCounter.textContent = `Бали: ${score}`;
        feedbackBox.classList.add("bg-[#eef7f0]", "border-[#b5d6be]");
        feedbackTitle.textContent = "Правильно!";
        feedbackTitle.className = "font-extrabold text-sm uppercase tracking-wide text-[#2b4536]";
        feedbackIcon.className = "fa-solid fa-circle-check text-lg text-[#2b4536]";
      } else {
        feedbackBox.classList.add("bg-[#faf0ee]", "border-[#f2c2b8]");
        feedbackTitle.textContent = "Неправильно!";
        feedbackTitle.className = "font-extrabold text-sm uppercase tracking-wide text-[#943429]";
        feedbackIcon.className = "fa-solid fa-circle-xmark text-lg text-[#943429]";
      }

      feedbackText.textContent = q.explanation;
      nextBtn.classList.remove("hidden");
    }

    nextBtn.onclick = () => {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    };

    function showResults() {
      quizArea.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      const percent = Math.round((score / questions.length) * 100);
      
      let message = "";
      if (percent >= 90) message = "Ідеальний результат! Ви справжній знавець стародавньої історії!";
      else if (percent >= 70) message = "Дуже хороший результат! Матеріал засвоєно на високому рівні.";
      else if (percent >= 50) message = "Непогано, але варто ще раз повторити деякі події та хронологію.";
      else message = "Гарна спроба! Рекомендуємо ще раз опрацювати конспект з цієї теми.";

      finalScoreText.innerHTML = `Ви набрали <strong class="text-[#2b4536] text-xl">${score} з ${questions.length}</strong> правильних відповідей (${percent}%).<br><br>${message}`;
    }

    restartBtn.onclick = () => {
      score = 0;
      currentQuestionIndex = 0;
      resultScreen.classList.add("hidden");
      quizArea.classList.remove("hidden");
      progressBar.style.width = "0%";
      renderQuestion();
    };

    // Запуск першого питання при завантаженні
    renderQuestion();
  </script>
</body>
</html>
